name: Desktop packages

on:
  push:
    branches: ["build/desktop-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64
            bundles: app
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-x64
            bundles: app
          - name: Windows x64
            os: windows-2022
            artifact: windows-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: cmake --version
      - run: npm ci
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo run --locked --manifest-path src-tauri/Cargo.toml --features tools --bin verify -- test-results/audio
      - name: Build native application and bundled audio helpers
        run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p releases
          codesign --verify --deep --strict src-tauri/target/release/bundle/macos/MixtapeForge.app
          ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/MixtapeForge.app releases/MixtapeForge-${{ matrix.artifact }}.zip
          shasum -a 256 releases/*.zip > releases/SHA256SUMS.txt
      - name: Collect Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force releases | Out-Null
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected one Windows installer" }
          Copy-Item $installers[0].FullName releases/
          Get-ChildItem releases/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content releases/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MixtapeForge-${{ matrix.artifact }}
          path: releases/*
          if-no-files-found: error
          retention-days: 30
