name: Website
on:
  push:
    branches: [main, master]
    paths: ["website/**", ".github/workflows/website.yml", "README.md"]
  pull_request:
    paths: ["website/**", ".github/workflows/website.yml", "README.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: "https://mixtapeforge.lucasciacca.com"
      BASE_PATH: "/"
      PUBLIC_REPOSITORY_URL: https://github.com/${{ github.repository }}
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run format:check && npm run check && npm test && npm run build && npm run verify
        working-directory: website
      - name: Static hosting files
        shell: bash
        run: |
          touch website/dist/.nojekyll
          if [ -n "$SITE_URL" ]; then
            SITE_HOST=$(node -p 'new URL(process.env.SITE_URL).hostname')
            if [[ "$SITE_HOST" != *.github.io ]]; then
              printf '%s\n' "$SITE_HOST" > website/dist/CNAME
            fi
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: website/dist
  publish:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_URL: "https://mixtapeforge.lucasciacca.com"
      BASE_PATH: "/"
      PUBLIC_REPOSITORY_URL: https://github.com/${{ github.repository }}
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/site-artifact
      - name: Update generated HTML branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website/dist
          tar -xf "$RUNNER_TEMP/site-artifact/artifact.tar" -C website/dist
          git add -f website/dist
          SITE_TREE=$(git write-tree --prefix=website/dist/)
          set --
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch origin gh-pages
            SITE_PREVIOUS=$(git rev-parse FETCH_HEAD)
            if [ "$(git rev-parse "$SITE_PREVIOUS^{tree}")" = "$SITE_TREE" ]; then
              echo 'Generated branch is already current.'
              exit 0
            fi
            set -- -p "$SITE_PREVIOUS"
          fi
          SITE_COMMIT=$(printf 'Publish static website\n' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$SITE_TREE" "$@")
          git push origin "$SITE_COMMIT:refs/heads/gh-pages"
      - name: Deploy checked artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
