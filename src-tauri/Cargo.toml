[package]
name = "cassette-maker"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
default-run = "cassette-maker"

[patch.crates-io]
cpal = { path = "vendor/cpal-0.15.3" }

[lib]
name = "cassette_core"
path = "src/lib.rs"

[features]
tools = []

[[bin]]
name = "check_output"
path = "src/bin/check_output.rs"
required-features = ["tools"]

[[bin]]
name = "list_devices"
path = "src/bin/list_devices.rs"
required-features = ["tools"]

[[bin]]
name = "playback_check"
path = "src/bin/playback_check.rs"
required-features = ["tools"]

[[bin]]
name = "probe"
path = "src/bin/probe.rs"
required-features = ["tools"]

[[bin]]
name = "verify"
path = "src/bin/verify.rs"
required-features = ["tools"]

[[bin]]
name = "verify_artwork"
path = "src/bin/verify_artwork.rs"
required-features = ["tools"]

[[bin]]
name = "verify_calibration"
path = "src/bin/verify_calibration.rs"
required-features = ["tools"]

[[bin]]
name = "verify_power"
path = "src/bin/verify_power.rs"
required-features = ["tools"]

[[bin]]
name = "verify_transport"
path = "src/bin/verify_transport.rs"
required-features = ["tools"]

[[bin]]
name = "verify_vst"
path = "src/bin/verify_vst.rs"
required-features = ["tools"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15.3"
keepawake = "=0.6.1"
symphonia = { version = "0.5.4", features = ["all"] }
hound = "3.5"
ebur128 = "0.1.10"
rustfft = "6.2"
ringbuf = "0.4"
rfd = "0.15"
sha2 = "0.10"
ttf-parser = "0.25.1"
base64 = "0.23.1"

[profile.release]
lto = "thin"
codegen-units = 1
